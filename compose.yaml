services:
  observatoire:
    build: .
    container_name: observatoire-jn
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    init: true
    restart: unless-stopped
    ports:
      - "0.0.0.0:${APP_PORT:-8088}:8765"
    environment:
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8765"
      OBSERVATORY_SOURCE_FILE: "/data/source/benchmark_from_mapping_pdf.xlsx"
      CONTRIBUTIONS_FILE: "/data/contributions/saisies_jumeaux_numeriques.xlsx"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-5}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-600}"
    volumes:
      - ./data/source:/data/source:ro
      - ./data/contributions:/data/contributions
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
