<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Observatoire interactif des jumeaux numériques territoriaux" data-i18n-content="meta.description">
    <title>Observatoire des jumeaux numériques territoriaux</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="a11y.skip">Aller au contenu</a>

    <header class="app-header">
      <div class="brand" aria-label="Cerema, climat et territoires de demain" data-i18n-aria="a11y.brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div>
          <strong>Cerema</strong>
          <small data-i18n="brand.tagline">Climat &amp; territoires de demain</small>
        </div>
      </div>
      <div class="header-title">
        <p data-i18n="header.eyebrow">Observatoire</p>
        <h1 data-i18n="header.title">Jumeaux numériques territoriaux</h1>
      </div>
      <div class="language-switch" role="group" aria-label="Language / Langue">
        <button type="button" data-language="fr" aria-label="Français">FR</button>
        <button type="button" data-language="en" aria-label="English">EN</button>
      </div>
      <button class="mobile-menu-button" type="button" aria-label="Ouvrir le menu" data-i18n-aria="a11y.menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Navigation principale" data-i18n-aria="a11y.navigation">
        <nav id="main-navigation"></nav>
        <div class="sidebar-footnote">
          <span class="status-dot"></span>
          <div>
            <strong data-i18n="local.title">Données locales</strong>
            <small data-i18n="local.detail">Aucun envoi vers un service externe</small>
          </div>
        </div>
      </aside>

      <main id="main-content" tabindex="-1">
        <section class="filter-panel" aria-label="Filtres globaux" data-i18n-aria="a11y.filters">
          <div class="filter-heading">
            <div>
              <span class="eyebrow" data-i18n="filter.scope">Périmètre affiché</span>
              <strong id="filter-result-count">0 solution</strong>
            </div>
            <button id="reset-filters" class="text-button" type="button" data-i18n="filter.reset">Réinitialiser</button>
          </div>
          <div class="filter-grid">
            <label class="search-field">
              <span data-i18n="filter.search">Rechercher</span>
              <input id="filter-search" type="search" placeholder="Solution, territoire, prestataire…">
            </label>
            <label>
              <span data-i18n="filter.source">Source</span>
              <select id="filter-source"></select>
            </label>
            <label>
              <span data-i18n="filter.country">Pays</span>
              <select id="filter-country"></select>
            </label>
            <label>
              <span data-i18n="filter.stage">Statut</span>
              <select id="filter-stage"></select>
            </label>
            <label class="toggle-field">
              <input id="filter-named" type="checkbox" checked>
              <span class="toggle-control" aria-hidden="true"></span>
              <span data-i18n="filter.named">Solutions nommées uniquement</span>
            </label>
          </div>
        </section>

        <div id="page-content" aria-live="polite"></div>

        <footer>
          <span id="data-date"></span>
        </footer>
      </main>
    </div>

    <div id="detail-dialog" class="dialog-backdrop" hidden>
      <section class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <button class="dialog-close" type="button" aria-label="Fermer la fiche" data-i18n-aria="a11y.closeRecord">&times;</button>
        <div id="detail-content"></div>
      </section>
    </div>

    <!-- Ordre de chargement : traductions, données, composants, puis application. -->
    <script src="js/i18n.js"></script>
    <script src="data/dashboard-data.js"></script>
    <script src="data/world-countries.js"></script>

    <!-- Outils et composants réutilisables. -->
    <script src="js/data-utils.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/ui-components.js"></script>

    <!-- Fonctionnalités classées par thème. -->
    <script src="js/dashboard-pages.js"></script>
    <script src="js/submission-form.js"></script>
    <script src="js/record-interactions.js"></script>

    <!-- Démarrage, navigation, filtres et événements. -->
    <script src="js/app.js"></script>
  </body>
</html>
